<!doctype html>
<html><head><meta charset="utf-8"><title>SW Diag</title></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel">
  function App(){ return <div id="marker">Hello from real Babel-transpiled React on real origin</div>; }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
window.__diag = { markers: [], registerCalled: false, resolved: false, rejected: null };
window.__diag.markers.push('trailing-script-ran');
if('serviceWorker' in navigator){
  window.__diag.registerCalled = true;
  navigator.serviceWorker.register('sw-diag.js').then(function(r){
    window.__diag.resolved = true;
    window.__diag.scope = r.scope;
  }).catch(function(e){
    window.__diag.rejected = e.name + ':' + e.message;
  });
} else {
  window.__diag.markers.push('sw-not-in-navigator');
}
</script>
</body></html>
